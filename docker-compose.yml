services:
  server:
    image: chat-server
    container_name: server
    ports:
      - "8080:8080"
    networks:
      - chat-network
    stdin_open: true
    tty: true

  client:
    image: chat-client
    networks:
      - chat-network
    stdin_open: true
    tty: true
    depends_on:
      - server

networks:
  chat-network:
    driver: bridge